name: deep-analysis
description: "深入分析特定问题：定义问题、研究背景、分析方案"
version: 1.0.0
tags: [analysis, deep-dive, research]
priority_base: 7
ttl_hours: 48
estimated_minutes: 15

triggers:
  auto: false
  keywords: ["分析", "深入", "研究", "analyze", "deep"]

inputs:
  problem:
    type: string
    required: true
    description: "要分析的问题"
  context:
    type: string
    default: ""
    description: "问题背景"

phases:
  - name: define
    type: planning
    description: "定义问题"
    prompt: "明确 {problem} 的范围、关键子问题和分析目标"
  - name: research
    type: literature_search
    description: "研究背景"
    prompt: "搜索 {problem} 相关的研究文献和解决方案"
    max_queries: 3
  - name: analyze
    type: knowledge_synthesis
    description: "深入分析"
    prompt: "综合文献和现有知识，深入分析 {problem} 的根因和可行方案"
  - name: conclude
    type: idea_generation
    description: "形成结论"
    prompt: "基于分析结果，形成结论和下一步行动建议"
  - name: spawn
    type: event_generation
    description: "生成后续探索"
    max_events: 2
