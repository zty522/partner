[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partner-research"
version = "1.1.0"
description = "Partner - an event-driven AI companion for staged execution, memory, growth, and long-running work."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Partner Team"},
]
keywords = ["ai", "research", "autonomous", "agent", "science", "literature", "companion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (required)
dependencies = [
    "aiohttp>=3.8",
    "PyYAML>=6.0",
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
    "json5>=0.9",
    "PySide6>=6.7; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Messaging platforms
wechat = ["wcferry>=39.0", "pilk>=0.2"]
qq = ["websockets>=11.0"]
qq-official = ["aiohttp>=3.8"]
wechat-official = []  # 纯标准库，零依赖
# Voice processing
voice = ["edge-tts>=6.1"]
stt-whisper = ["openai-whisper>=20230918"]
stt-funasr = ["funasr>=1.0"]
tts-cosyvoice = ["torchaudio>=2.0"]
# Development
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
desktop = ["PySide6>=6.7"]
content = ["playwright>=1.40", "yt-dlp>=2024.12.0", "pillow>=10.0", "pytesseract>=0.3"]
cytobridge = ["cytobridge-agent>=1.0.0"]
# All optional dependencies
all = [
    "partner-research[wechat,qq,voice,content,cytobridge]",
]

[project.scripts]
partner = "partner.cli:main"
partner-manager = "partner.manager:main"

[project.urls]
Homepage = "https://github.com/zty522/partner"
Documentation = "https://github.com/zty522/partner#readme"
Repository = "https://github.com/zty522/partner"
Issues = "https://github.com/zty522/partner/issues"

[tool.setuptools.packages.find]
include = ["partner*"]

[tool.setuptools.package-data]
partner = ["assets/*", "assets/icons/*", "agents/manifests/*.json"]
