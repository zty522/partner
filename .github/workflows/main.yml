name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip
      - name: Install Partner + PySide6 + PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Verify spec file
        shell: pwsh
        run: Test-Path scripts/partner_windows.spec
      - name: Build desktop app
        shell: pwsh
        run: |
          echo "Current dir: $(pwd)"
          echo "Files in scripts/:"
          dir scripts/partner_windows.spec
          echo "Python version:"
          python --version
          echo "PyInstaller location:"
          python -c "import PyInstaller; print(PyInstaller.__file__)" 2>&1
          python -m PyInstaller --distpath dist --workpath build --clean --noconfirm scripts/partner_windows.spec 2>&1
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner.exe
          overwrite_files: true
