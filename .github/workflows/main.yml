name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Prepare release assets
        shell: pwsh
        run: |
          # Rename EXE to include version
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (Test-Path dist/Partner.exe) {
            Copy-Item dist/Partner.exe "dist/Partner-$ver.exe"
          }
          if (Test-Path dist/Partner_Setup.exe) {
            Copy-Item dist/Partner_Setup.exe "dist/Partner-$ver-Setup.exe"
          }
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Partner-*.exe
          overwrite_files: true
