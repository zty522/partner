name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
      - name: Rename EXE for release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist/Partner.exe "dist/Partner-$ver-Setup.exe" -Force
          Write-Host "✅ EXE ready: Partner-$ver-Setup.exe"
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner-*-Setup.exe
          overwrite_files: true
