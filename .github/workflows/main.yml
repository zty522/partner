name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --timeout 120
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          # Keep Partner.exe for ISCC (it references this name)
          Copy-Item dist/Partner.exe "dist/Partner-$ver.exe" -Force
          # Build Inno Setup installer
          $iscc = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not $iscc) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          Write-Host "ISCC: $iscc"
          if (Test-Path $iscc) {
            & $iscc shells/partner_installer.iss
            if ($LASTEXITCODE -eq 0 -and (Test-Path dist/Partner_Setup.exe)) {
              Move-Item dist/Partner_Setup.exe "dist/Partner-$ver-Setup.exe" -Force
              Write-Host "✅ Inno Setup installer done: Partner-$ver-Setup.exe"
            } else {
              Write-Host "⚠ ISCC failed, renaming raw EXE as fallback"
              Move-Item dist/Partner-$ver.exe "dist/Partner-$ver-Setup.exe" -Force
            }
          } else {
            Write-Host "⚠ ISCC not found, renaming raw EXE as fallback"
            Move-Item dist/Partner-$ver.exe "dist/Partner-$ver-Setup.exe" -Force
          }
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner-*-Setup.exe
          overwrite_files: true
