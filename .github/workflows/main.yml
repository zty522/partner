name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
          if (-not (Test-Path "dist/Partner.exe")) { throw "PyInstaller build failed - dist/Partner.exe not found" }
      - name: Install Inno Setup (via Chocolatey)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress --timeout 120 2>&1
          Write-Host "Chocolatey exit code: $LASTEXITCODE"
      - name: Build Inno Setup installer
        id: iscc_build
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          # Find ISCC
          $iscc = ""
          $paths = @(
            "ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 5\ISCC.exe"
          )
          foreach ($p in $paths) {
            $resolved = (Get-Command $p -ErrorAction SilentlyContinue).Source
            if ($resolved) { $iscc = $resolved; break }
            if (Test-Path $p) { $iscc = $p; break }
          }
          Write-Host "ISCC found at: $iscc"
          $iscc_ok = $false
          if ($iscc -and (Test-Path $iscc)) {
            & $iscc shells/partner_installer.iss 2>&1
            $isccExit = $LASTEXITCODE
            Write-Host "ISCC exit code: $isccExit"
            if ($isccExit -eq 0 -and (Test-Path dist/Partner_Setup.exe)) {
              Move-Item dist/Partner_Setup.exe "dist/Partner-$ver-Setup.exe" -Force
              Write-Host "✅ Real Inno Setup installer: dist/Partner-$ver-Setup.exe"
              $iscc_ok = $true
            } else {
              Write-Host "⚠ ISCC failed (exit=$isccExit), falling back to raw EXE rename"
            }
          } else {
            Write-Host "⚠ ISCC not found, falling back to raw EXE rename"
          }
          if (-not $iscc_ok) {
            Copy-Item dist/Partner.exe "dist/Partner-$ver-Setup.exe" -Force
            Write-Host "⚠ Fallback raw EXE: dist/Partner-$ver-Setup.exe"
          }
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner-*-Setup.exe
          overwrite_files: true
