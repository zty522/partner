name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
      - name: Rename EXE for release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist/Partner.exe "dist/Partner-$ver-Setup.exe" -Force
          Write-Host "✅ EXE ready: Partner-$ver-Setup.exe"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --timeout 120
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = Get-Command "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue }
          if (-not $iscc) { $iscc = Get-Command "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue }
          if ($iscc) { echo "ISCC_PATH=$($iscc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      - name: Build Inno Setup installer (optional)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (Test-Path env:ISCC_PATH) {
            $iss = Resolve-Path "shells/partner_installer.iss"
            Write-Host "Building installer from $iss ..."
            $output = & $env:ISCC_PATH $iss 2>&1
            $exitCode = $LASTEXITCODE
            Write-Host $output -Separator "`n"
            if ($exitCode -eq 0 -and (Test-Path dist/Partner_Setup.exe)) {
              Move-Item dist/Partner_Setup.exe "dist/Partner-$ver-Setup.exe" -Force
              Write-Host "✅ Inno Setup installer ready: Partner-$ver-Setup.exe"
            } else {
              Write-Host "⚠ ISCC failed (exit $exitCode), keeping renamed EXE as installer"
            }
          } else {
            Write-Host "⚠ ISCC not available, keeping renamed EXE"
          }
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner-*-Setup.exe
          overwrite_files: true
