name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip
      - name: Install Partner + PySide6 + PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Verify spec file
        shell: pwsh
        run: Test-Path scripts/partner_windows.spec
      - name: Build desktop app
        shell: pwsh
        run: python -m PyInstaller scripts/partner_windows.spec --clean --noconfirm
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner.exe
          overwrite_files: true
