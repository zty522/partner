name: Build Windows Desktop App
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 -e .
      - name: Build desktop app (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller shells/partner_windows.spec --clean --noconfirm
      - name: Rename EXE for release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist/Partner.exe "dist/Partner-$ver-Setup.exe" -Force
          Write-Host "✅ EXE ready: Partner-$ver-Setup.exe"
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist/ -Recurse
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Partner-*-Setup.exe
          overwrite_files: true
      - name: Clean old stale assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After upload, delete stale assets from prior builds
          try {
            $ids = gh release view v1.1.0 --json assets -q '.assets[] | select(.name | endswith(".exe") and not contains("Setup")) | .id' 2>$null
            if ($ids) {
              $ids -split "`n" | ForEach-Object {
                $id = $_.Trim()
                if ($id) {
                  gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$id" 2>$null
                  Write-Host "Deleted stale asset $id"
                }
              }
            }
          } catch {
            Write-Host "⚠ No stale assets to clean"
          }
